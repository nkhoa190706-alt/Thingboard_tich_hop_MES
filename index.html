<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES-Lite 3D - Hệ Thống Điều Hành Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        .printer-card:hover { transform: translateY(-4px); transition: all 0.3s ease; }
        #root:empty::before {
            content: "Đang khởi tạo hệ thống MES-Lite...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        // Thành phần biểu tượng SVG nội bộ (Không phụ thuộc thư viện ngoài)
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                dashboard: <path d="M3 3h7v9H3V3zm11 0h7v5h-7V3zm0 9h7v9h-7v-9zM3 16h7v5H3v-5z"/>,
                jobs: <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4-2v4m-3-2h6M9 11h6m-6 4h6m-6 4h3"/>,
                printer: <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 8V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M6 14h12v8H6v-8z"/>,
                activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                alert: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/>,
                check: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/>,
                settings: (
                    <>
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [isConfigOpen, setIsConfigOpen] = React.useState(false);
            
            // Xử lý LocalStorage an toàn
            const getSafeStorage = (key, fallback) => {
                try {
                    return localStorage.getItem(key) || fallback;
                } catch (e) {
                    return fallback;
                }
            };

            const [config, setConfig] = React.useState({
                host: getSafeStorage('tb_host', '192.168.1.100'),
                token: getSafeStorage('tb_token', '')
            });

            const [telemetry, setTelemetry] = React.useState({
                temp: 0,
                progress: 0,
                power: 0,
                oee: 0,
                status: 'offline'
            });

            const saveConfig = () => {
                try {
                    localStorage.setItem('tb_host', config.host);
                    localStorage.setItem('tb_token', config.token);
                } catch (e) {
                    console.error("Không thể lưu cấu hình vào trình duyệt.");
                }
                setIsConfigOpen(false);
                fetchData();
            };

            const fetchData = React.useCallback(async () => {
                if (!config.token) return;
                // Giả lập cập nhật để demo khi chưa kết nối thật
                setTelemetry(prev => ({
                    ...prev,
                    temp: 200 + Math.random() * 20,
                    progress: prev.progress >= 100 ? 0 : prev.progress + 1,
                    status: 'printing',
                    oee: 88.4
                }));
            }, [config]);

            React.useEffect(() => {
                const interval = setInterval(fetchData, 3000);
                return () => clearInterval(interval);
            }, [fetchData]);

            const renderDashboard = () => (
                <div className="space-y-8">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-slate-400 text-[10px] font-black uppercase tracking-wider">OEE Hiệu suất</span>
                                <Icon name="activity" className="text-blue-500" />
                            </div>
                            <div className="text-4xl font-extrabold text-slate-900">{telemetry.oee}%</div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-[10px] font-black uppercase tracking-wider block mb-4">Nhiệt độ</span>
                            <div className="text-4xl font-extrabold text-orange-500">{telemetry.temp.toFixed(1)}°C</div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-[10px] font-black uppercase tracking-wider block mb-4">Trạng thái</span>
                            <div className="text-2xl font-black text-blue-600 uppercase italic">{telemetry.status}</div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-[10px] font-black uppercase tracking-wider block mb-4">Tiến độ</span>
                            <div className="text-4xl font-extrabold text-slate-900">{telemetry.progress}%</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm">
                        <h3 className="text-xl font-black text-slate-800 mb-8 flex items-center gap-2">
                            <Icon name="printer" className="text-blue-600" /> Giám sát máy in real-time
                        </h3>
                        <div className="w-full bg-slate-100 h-6 rounded-full overflow-hidden p-1 shadow-inner">
                            <div className="bg-blue-600 h-full rounded-full transition-all duration-1000" style={{width: `${telemetry.progress}%`}}></div>
                        </div>
                        <div className="mt-4 text-center text-xs font-bold text-slate-400 uppercase tracking-widest">
                            {config.token ? `Đang nhận dữ liệu từ ${config.host}` : "Chưa có Token kết nối"}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen">
                    <aside className="w-20 lg:w-72 bg-white border-r border-slate-200 flex flex-col p-6 sticky top-0 h-screen">
                        <div className="mb-12 flex items-center gap-3">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg"><Icon name="printer" /></div>
                            <h1 className="hidden lg:block text-xl font-black italic tracking-tighter">MES-LITE 3D</h1>
                        </div>
                        <nav className="flex-1 space-y-2">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-4 p-4 rounded-2xl ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                <Icon name="dashboard" /> <span className="hidden lg:block font-bold text-sm">Dashboard</span>
                            </button>
                            <button onClick={() => setActiveTab('jobs')} className={`w-full flex items-center gap-4 p-4 rounded-2xl ${activeTab === 'jobs' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>
                                <Icon name="jobs" /> <span className="hidden lg:block font-bold text-sm">Lệnh in</span>
                            </button>
                        </nav>
                        <button onClick={() => setIsConfigOpen(true)} className="mt-auto flex items-center gap-4 p-4 rounded-2xl text-slate-400 hover:bg-slate-50">
                            <Icon name="settings" /> <span className="hidden lg:block font-bold text-sm">Cài đặt API</span>
                        </button>
                    </aside>

                    <main className="flex-1 p-6 lg:p-12">
                        <header className="mb-12">
                            <h2 className="text-3xl font-black tracking-tight">{activeTab === 'dashboard' ? 'Điều Hành Sản Xuất' : 'Quản Lý Lệnh In'}</h2>
                        </header>
                        {activeTab === 'dashboard' ? renderDashboard() : <div className="p-20 text-center border-2 border-dashed rounded-[3rem] text-slate-300 font-bold">Dữ liệu đang tải...</div>}
                    </main>

                    {isConfigOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50">
                            <div className="bg-white p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-2xl font-black mb-6 flex items-center gap-3"><Icon name="settings" className="text-blue-600" /> Cấu hình IoT</h3>
                                <div className="space-y-4">
                                    <input className="w-full p-4 bg-slate-50 border rounded-2xl outline-none" value={config.host} onChange={e => setConfig({...config, host: e.target.value})} placeholder="IP Host" />
                                    <input className="w-full p-4 bg-slate-50 border rounded-2xl outline-none" value={config.token} onChange={e => setConfig({...config, token: e.target.value})} placeholder="Access Token" />
                                    <div className="flex gap-2">
                                        <button onClick={() => setIsConfigOpen(false)} className="flex-1 p-4 font-bold text-slate-400">Đóng</button>
                                        <button onClick={saveConfig} className="flex-1 p-4 bg-blue-600 text-white rounded-2xl font-bold uppercase tracking-widest">Lưu & Kết nối</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
