
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES-Lite 3D - Hệ Thống Điều Hành Thông Minh</title>
    <!-- Các thư viện cần thiết -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Sửa lỗi: Sử dụng thư viện lucide-react thay vì lucide -->
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        // Destructure các icon từ thư viện LucideReact
        const { 
            LayoutDashboard, ClipboardList, Settings, Activity, Printer, 
            Zap, Clock, CheckCircle2, AlertTriangle, Layers, User 
        } = LucideReact;

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            
            // Dữ liệu giả lập từ hệ thống ThingsBoard
            const [stats] = React.useState({
                oee: 82.5,
                availability: 94,
                performance: 88,
                quality: 99.2,
                totalOutput: 156,
                activePrinters: 2
            });

            const [printers] = React.useState([
                { id: 'P01', name: 'Creality K1 Max', status: 'printing', temp: 220, progress: 74, power: 185, job: 'Gear_Box_v2.gcode' },
                { id: 'P02', name: 'Bambu Lab X1C', status: 'idle', temp: 28, progress: 0, power: 12, job: 'None' }
            ]);

            const renderDashboard = () => (
                <div className="space-y-8 animate-in fade-in duration-700">
                    {/* OEE Summary Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Hiệu suất OEE</span>
                                <div className="p-2 bg-blue-50 rounded-lg text-blue-500"><Activity size={18} /></div>
                            </div>
                            <div className="text-4xl font-extrabold text-slate-900">{stats.oee}%</div>
                            <div className="mt-3 w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-blue-500 h-full" style={{width: `${stats.oee}%`}}></div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Khả dụng (A)</span>
                            <div className="text-4xl font-extrabold text-emerald-500">{stats.availability}%</div>
                            <p className="text-xs text-slate-400 mt-2 font-medium">Thời gian máy sẵn sàng</p>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Chất lượng (Q)</span>
                            <div className="text-4xl font-extrabold text-purple-500">{stats.quality}%</div>
                            <p className="text-xs text-slate-400 mt-2 font-medium">Tỷ lệ sản phẩm đạt chuẩn</p>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Tổng sản lượng</span>
                            <div className="text-4xl font-extrabold text-slate-900">{stats.totalOutput}</div>
                            <p className="text-xs text-emerald-500 mt-2 font-bold flex items-center gap-1">
                                <CheckCircle2 size={12} /> Hoàn thành kế hoạch
                            </p>
                        </div>
                    </div>

                    {/* Printer Status Section */}
                    <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
                        <div className="xl:col-span-2 space-y-6">
                            <h3 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                                <Printer size={24} className="text-blue-600" />
                                Giám sát Máy in trực tiếp
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {printers.map(printer => (
                                    <div key={printer.id} className="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm hover:border-blue-200 transition-all">
                                        <div className="flex justify-between items-start mb-8">
                                            <div>
                                                <h4 className="text-lg font-bold text-slate-900">{printer.name}</h4>
                                                <div className={`mt-2 inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest ${
                                                    printer.status === 'printing' ? 'bg-orange-100 text-orange-600' : 'bg-emerald-100 text-emerald-600'
                                                }`}>
                                                    <span className={`w-2 h-2 rounded-full ${printer.status === 'printing' ? 'bg-orange-500 animate-pulse' : 'bg-emerald-500'}`}></span>
                                                    {printer.status}
                                                </div>
                                            </div>
                                            <div className="p-3 bg-slate-50 rounded-2xl">
                                                <Layers className="text-slate-400" size={20} />
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="flex justify-between items-end">
                                                <span className="text-sm font-bold text-slate-400 uppercase tracking-tighter">Tiến độ in</span>
                                                <span className="text-2xl font-black text-slate-900">{printer.progress}%</span>
                                            </div>
                                            <div className="w-full bg-slate-100 h-5 rounded-2xl overflow-hidden p-1">
                                                <div className="bg-gradient-to-r from-blue-600 to-indigo-400 h-full rounded-xl transition-all duration-1000" 
                                                     style={{ width: `${printer.progress}%` }}></div>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-50">
                                                <div className="flex flex-col">
                                                    <span className="text-[10px] text-slate-400 font-bold uppercase">Nhiệt độ</span>
                                                    <span className="text-sm font-extrabold text-orange-600">{printer.temp}°C</span>
                                                </div>
                                                <div className="flex flex-col">
                                                    <span className="text-[10px] text-slate-400 font-bold uppercase">Công suất</span>
                                                    <span className="text-sm font-extrabold text-blue-600">{printer.power}W</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Recent Alerts */}
                        <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white">
                            <h3 className="text-xl font-bold mb-8 flex items-center gap-2">
                                <AlertTriangle className="text-yellow-400" size={22} />
                                Cảnh báo & Nhật ký
                            </h3>
                            <div className="space-y-6">
                                <div className="flex gap-4 p-4 bg-white/5 rounded-2xl border border-white/10">
                                    <div className="p-2 bg-emerald-500/20 text-emerald-400 h-fit rounded-lg"><CheckCircle2 size={16}/></div>
                                    <div>
                                        <p className="text-sm font-bold text-white">In hoàn thành</p>
                                        <p className="text-xs text-slate-400 mt-1">Máy P02 vừa hoàn thành Gear_Box.gcode</p>
                                    </div>
                                </div>
                                <div className="flex gap-4 p-4 bg-white/5 rounded-2xl border border-white/10">
                                    <div className="p-2 bg-blue-500/20 text-blue-400 h-fit rounded-lg"><Clock size={16}/></div>
                                    <div>
                                        <p className="text-sm font-bold text-white">Lịch trình mới</p>
                                        <p className="text-xs text-slate-400 mt-1">Đã xếp hàng 3 lệnh in cho ngày mai</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-24 lg:w-72 bg-white border-r border-slate-200 flex flex-col p-6 sticky top-0 h-screen transition-all">
                        <div className="mb-12 flex items-center gap-3 px-2">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <Printer size={24} />
                            </div>
                            <div className="hidden lg:block">
                                <h1 className="text-xl font-black tracking-tighter text-slate-900">MES-LITE</h1>
                                <div className="text-[10px] text-slate-400 font-black uppercase tracking-widest">Smart Lab Solution</div>
                            </div>
                        </div>

                        <nav className="flex-1 space-y-3">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-xl shadow-blue-100' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <LayoutDashboard size={22} />
                                <span className="hidden lg:block font-bold text-sm tracking-tight">Bảng vận hành</span>
                            </button>
                            <button onClick={() => setActiveTab('jobs')} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all ${activeTab === 'jobs' ? 'bg-blue-600 text-white shadow-xl shadow-blue-100' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <ClipboardList size={22} />
                                <span className="hidden lg:block font-bold text-sm tracking-tight">Lệnh sản xuất</span>
                            </button>
                        </nav>

                        <div className="mt-auto p-2">
                            <div className="flex items-center gap-3 p-3 bg-slate-50 rounded-2xl">
                                <div className="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center"><User size={16} /></div>
                                <div className="hidden lg:block">
                                    <p className="text-xs font-black text-slate-900 uppercase">Admin Lab</p>
                                    <p className="text-[10px] text-slate-400 font-bold">Quản lý dự án</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 p-8 lg:p-12 max-w-[1600px] mx-auto w-full">
                        <header className="flex justify-between items-center mb-12">
                            <div>
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">
                                    {activeTab === 'dashboard' ? 'Điều Hành Sản Xuất' : 'Quản Lý Lệnh In'}
                                </h2>
                                <p className="text-slate-400 font-medium text-sm mt-1">Lab IOT & Chuyển đổi số</p>
                            </div>
                            <div className="flex items-center gap-4 px-5 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm">
                                <span className="text-xs font-black text-emerald-500 flex items-center gap-2">
                                    <span className="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                                    HỆ THỐNG TRỰC TUYẾN
                                </span>
                            </div>
                        </header>

                        {activeTab === 'dashboard' ? renderDashboard() : (
                            <div className="bg-white rounded-[3rem] p-20 text-center border border-dashed border-slate-300">
                                <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-300">
                                    <ClipboardList size={40} />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800">Dữ liệu đơn hàng đang được tải...</h3>
                                <p className="text-slate-400 max-sm mx-auto mt-2 font-medium">Kết nối với Database ThingsBoard để lấy danh sách tệp G-code mới nhất.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
