

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MES Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .dashboard {
      display: grid;

grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .value {
      font-size: 28px;
      color: #007bff;
    }
  </style>
</head>
<body>

<h1>📊 MES Dashboard</h1>

<div class="dashboard">
  <div class="card">
    <h3>Sản lượng hôm nay</h3>
    <div class="value" id="production">0</div>

</div>

  <div class="card">
    <h3>Máy đang chạy</h3>
    <div class="value" id="machines">0</div>
  </div>

  <div class="card">
    <h3>Tình trạng hệ thống</h3>
    <div class="value" id="status">OK</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
