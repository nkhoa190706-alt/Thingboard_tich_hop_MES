<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES-Lite 3D - Hệ Thống Điều Hành Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .printer-card:hover { transform: translateY(-4px); transition: all 0.3s ease; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-[#f8fafc]">
    <div id="root"></div>

    <script type="text/babel">
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                dashboard: <path d="M3 3h7v9H3V3zm11 0h7v5h-7V3zm0 9h7v9h-7v-9zM3 16h7v5H3v-5z"/>,
                jobs: <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m4-2v4m-3-2h6M9 11h6m-6 4h6m-6 4h3"/>,
                printer: <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 8V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4M6 14h12v8H6v-8z"/>,
                activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>,
                zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                alert: <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4m0 4h.01"/>,
                check: <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/>,
                settings: (
                    <React.Fragment>
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </React.Fragment>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [isConfigOpen, setIsConfigOpen] = React.useState(false);
            const [config, setConfig] = React.useState({
                host: localStorage.getItem('tb_host') || '192.168.1.100',
                token: localStorage.getItem('tb_token') || ''
            });

            // Dữ liệu thực tế (Khởi tạo bằng dữ liệu mẫu)
            const [telemetry, setTelemetry] = React.useState({
                temp: 0,
                progress: 0,
                power: 0,
                oee: 0,
                status: 'offline'
            });

            // Hàm lưu cấu hình
            const saveConfig = () => {
                localStorage.setItem('tb_host', config.host);
                localStorage.setItem('tb_token', config.token);
                setIsConfigOpen(false);
                fetchData();
            };

            // Hàm lấy dữ liệu từ ThingsBoard
            const fetchData = async () => {
                if (!config.token) return;
                try {
                    // Trong thực tế bạn sẽ gọi API của ThingsBoard ở đây
                    // GET http://host:8080/api/plugins/telemetry/DEVICE/device_id/values/timeseries
                    console.log("Fetching from:", config.host);
                    
                    // Giả lập cập nhật dữ liệu để minh họa
                    setTelemetry(prev => ({
                        ...prev,
                        temp: 200 + Math.random() * 20,
                        progress: Math.min(100, prev.progress + 1),
                        status: 'printing',
                        oee: 85.5
                    }));
                } catch (error) {
                    console.error("Lỗi kết nối ThingsBoard:", error);
                }
            };

            // Chạy fetch dữ liệu mỗi 5 giây
            React.useEffect(() => {
                const interval = setInterval(fetchData, 5000);
                return () => clearInterval(interval);
            }, [config]);

            const renderDashboard = () => (
                <div className="space-y-8 animate-in fade-in duration-700">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm transition-all hover:shadow-md">
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Hiệu suất OEE</span>
                                <div className="p-2 bg-blue-50 rounded-lg text-blue-500"><Icon name="activity" size={18} /></div>
                            </div>
                            <div className="text-4xl font-extrabold text-slate-900">{telemetry.oee > 0 ? telemetry.oee : '--'}%</div>
                            <div className="mt-3 w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-blue-600 h-full transition-all duration-1000" style={{width: `${telemetry.oee}%`}}></div>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Nhiệt độ đầu phun</span>
                            <div className="text-4xl font-extrabold text-orange-500">{telemetry.temp > 0 ? telemetry.temp.toFixed(1) : '--'}°C</div>
                            <p className="text-[10px] text-slate-400 mt-2 font-bold uppercase tracking-widest">Extruder Temp</p>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Trạng thái máy</span>
                            <div className={`text-2xl font-black uppercase tracking-tighter ${telemetry.status === 'printing' ? 'text-blue-600' : 'text-slate-300'}`}>
                                {telemetry.status.toUpperCase()}
                            </div>
                            <div className="flex items-center gap-2 mt-2">
                                <div className={`w-2 h-2 rounded-full ${telemetry.status === 'printing' ? 'bg-blue-500 animate-pulse' : 'bg-slate-300'}`}></div>
                                <span className="text-[10px] text-slate-400 font-bold">Real-time update</span>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider block mb-4">Tiến độ in</span>
                            <div className="text-4xl font-extrabold text-slate-900">{telemetry.progress}%</div>
                            <div className="w-full bg-slate-100 h-1.5 mt-3 rounded-full overflow-hidden">
                                <div className="bg-emerald-500 h-full transition-all duration-1000" style={{width: `${telemetry.progress}%`}}></div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2">
                            <div className="bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-sm">
                                <div className="flex justify-between items-center mb-10">
                                    <h3 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                                        <Icon name="printer" size={24} className="text-blue-600" />
                                        Mô phỏng vận hành máy in
                                    </h3>
                                    {!config.token && (
                                        <div className="text-xs font-bold text-red-500 bg-red-50 px-3 py-1 rounded-full flex items-center gap-2">
                                            <Icon name="alert" size={12} /> CHƯA CÓ TOKEN KẾT NỐI
                                        </div>
                                    )}
                                </div>
                                
                                <div className="space-y-10">
                                    <div className="flex flex-col md:flex-row md:items-center gap-8 justify-between">
                                        <div className="flex-1">
                                            <div className="flex justify-between mb-4">
                                                <span className="text-xs font-black text-slate-400 uppercase">Tên tệp tin đang in</span>
                                                <span className="text-xs font-black text-blue-600 uppercase">Robot_Part_01.gcode</span>
                                            </div>
                                            <div className="w-full bg-slate-50 h-8 rounded-2xl overflow-hidden p-1.5 border border-slate-100">
                                                <div className="bg-gradient-to-r from-blue-600 to-blue-400 h-full rounded-xl transition-all duration-1000" 
                                                     style={{ width: `${telemetry.progress}%` }}></div>
                                            </div>
                                        </div>
                                        <div className="flex gap-6">
                                            <div className="text-center">
                                                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">Thời gian</div>
                                                <div className="text-lg font-black tracking-tighter">01:24:10</div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-[10px] font-bold text-slate-400 uppercase mb-1">Dự kiến xong</div>
                                                <div className="text-lg font-black tracking-tighter text-blue-600">00:45:12</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-slate-50 rounded-3xl p-6 grid grid-cols-2 md:grid-cols-4 gap-6">
                                        <div className="text-center md:text-left border-r border-slate-200">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Vòi phun</span>
                                            <span className="text-lg font-black text-orange-600">225.4°C</span>
                                        </div>
                                        <div className="text-center md:text-left border-r border-slate-200">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Bàn in</span>
                                            <span className="text-lg font-black text-indigo-600">60.2°C</span>
                                        </div>
                                        <div className="text-center md:text-left border-r border-slate-200">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Công suất</span>
                                            <span className="text-lg font-black text-slate-900">148W</span>
                                        </div>
                                        <div className="text-center md:text-left">
                                            <span className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Quạt gió</span>
                                            <span className="text-lg font-black text-blue-500">100%</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl shadow-slate-900/20">
                            <h3 className="text-xl font-bold mb-8 flex items-center gap-2">
                                <Icon name="alert" size={22} className="text-yellow-400" />
                                Nhật ký hệ thống
                            </h3>
                            <div className="space-y-6">
                                <div className="flex gap-4 p-4 bg-white/5 rounded-2xl border border-white/10">
                                    <div className="p-2 bg-blue-500/20 text-blue-400 h-fit rounded-lg"><Icon name="activity" size={16}/></div>
                                    <div>
                                        <p className="text-sm font-bold">Kế nối thành công</p>
                                        <p className="text-[10px] text-slate-500 mt-1 uppercase font-bold tracking-widest">Thingboard Host: {config.host}</p>
                                    </div>
                                </div>
                                <div className="flex gap-4 p-4 bg-white/5 rounded-2xl border border-white/10">
                                    <div className="p-2 bg-yellow-500/20 text-yellow-400 h-fit rounded-lg"><Icon name="zap" size={16}/></div>
                                    <div>
                                        <p className="text-sm font-bold">Điện năng tiêu thụ cao</p>
                                        <p className="text-[10px] text-slate-500 mt-1 uppercase font-bold tracking-widest">P-01 Peak: 245W</p>
                                    </div>
                                </div>
                            </div>
                            <button 
                                onClick={() => setIsConfigOpen(true)}
                                className="w-full mt-10 py-4 bg-white text-slate-900 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-slate-100 transition-all flex items-center justify-center gap-2"
                            >
                                <Icon name="settings" size={18} /> Cấu hình kết nối
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex min-h-screen">
                    {/* Sidebar */}
                    <aside className="w-20 lg:w-72 bg-white border-r border-slate-200 flex flex-col p-6 sticky top-0 h-screen">
                        <div className="mb-12 flex items-center gap-3 px-2">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <Icon name="printer" size={24} />
                            </div>
                            <div className="hidden lg:block">
                                <h1 className="text-xl font-black tracking-tighter text-slate-900 italic">MES-LITE 3D</h1>
                            </div>
                        </div>

                        <nav className="flex-1 space-y-3">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-xl shadow-blue-100' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="dashboard" size={22} />
                                <span className="hidden lg:block font-bold text-sm">Dashboard</span>
                            </button>
                            <button onClick={() => setActiveTab('jobs')} className={`w-full flex items-center gap-4 p-4 rounded-2xl transition-all ${activeTab === 'jobs' ? 'bg-blue-600 text-white shadow-xl shadow-blue-100' : 'text-slate-400 hover:bg-slate-50'}`}>
                                <Icon name="jobs" size={22} />
                                <span className="hidden lg:block font-bold text-sm">Lệnh in</span>
                            </button>
                        </nav>

                        <div className="mt-auto border-t border-slate-100 pt-6">
                            <button onClick={() => setIsConfigOpen(true)} className="w-full flex items-center gap-4 p-4 rounded-2xl text-slate-400 hover:bg-slate-50">
                                <Icon name="settings" size={22} />
                                <span className="hidden lg:block font-bold text-sm">Cài đặt API</span>
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-8 lg:p-12 max-w-[1600px] mx-auto w-full">
                        <header className="flex justify-between items-center mb-12">
                            <div>
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">
                                    {activeTab === 'dashboard' ? 'Hệ Thống Điều Hành' : 'Quản Lý Lệnh In'}
                                </h2>
                                <p className="text-slate-400 font-bold text-xs uppercase tracking-widest mt-1">Smart Manufacturing Lab</p>
                            </div>
                            <div className="hidden sm:flex items-center gap-4 px-6 py-3 bg-white border border-slate-200 rounded-3xl shadow-sm">
                                <span className={`text-[10px] font-black flex items-center gap-2 ${config.token ? 'text-emerald-500' : 'text-red-500'}`}>
                                    <span className={`w-2 h-2 rounded-full ${config.token ? 'bg-emerald-500 animate-ping' : 'bg-red-500'}`}></span>
                                    {config.token ? 'SYSTEM ONLINE' : 'CONNECTION ERROR'}
                                </span>
                            </div>
                        </header>

                        {activeTab === 'dashboard' ? renderDashboard() : (
                            <div className="bg-white rounded-[3rem] p-20 text-center border-2 border-dashed border-slate-200">
                                <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-300">
                                    <Icon name="jobs" size={40} />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 tracking-tight">Kho lưu trữ tệp G-Code</h3>
                                <p className="text-slate-400 max-w-xs mx-auto mt-2 font-medium text-sm">Vui lòng hoàn tất cấu hình ThingsBoard để tải danh sách tệp in từ máy chủ.</p>
                            </div>
                        )}
                    </main>

                    {/* Modal Cấu hình */}
                    {isConfigOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-md p-10 shadow-2xl animate-in zoom-in duration-300">
                                <h3 className="text-2xl font-black text-slate-900 mb-8 tracking-tighter flex items-center gap-3">
                                    <Icon name="settings" size={28} className="text-blue-600" />
                                    Cấu hình IoT
                                </h3>
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Địa chỉ IP Server</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-mono text-sm"
                                            value={config.host}
                                            onChange={(e) => setConfig({...config, host: e.target.value})}
                                            placeholder="192.168.1.100"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Access Token (ThingsBoard)</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-mono text-sm"
                                            value={config.token}
                                            onChange={(e) => setConfig({...config, token: e.target.value})}
                                            placeholder="Dán token thiết bị tại đây"
                                        />
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button 
                                            onClick={() => setIsConfigOpen(false)}
                                            className="flex-1 py-4 text-sm font-bold text-slate-500 hover:bg-slate-50 rounded-2xl transition-all"
                                        >
                                            Hủy
                                        </button>
                                        <button 
                                            onClick={saveConfig}
                                            className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all"
                                        >
                                            Kết nối ngay
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        window.addEventListener('DOMContentLoaded', () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>
